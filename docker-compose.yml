services:
  frontend:
    build:
      context: ./vue-service
      dockerfile: Dockerfile
      args:
        VITE_GO_API_URL: http://localhost:3000
        VITE_GO_API_PATH: /api/v1/matrix/qr
        VITE_JWT_TOKEN: "${VITE_JWT_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJtYXRyaXgtY2hhbGxlbmdlLWNsaWVudCIsImlhdCI6MTc4ODU0MjUwOSwiZXhwIjoxNzg5MTQ3MzA5fQ.MOBL6mSnLR4wPTZZQ0L0YmszXFSagxpjRgSZry4HKt8}"
    ports:
      - "5173:80"
    depends_on:
      go-api:
        condition: service_started
    networks:
      - app-network

  go-api:
    build:
      context: ./go-matrix-service
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      NODE_SERVICE_URL: "http://node-api:4000/api/v1/stats"
    ports:
      - "3000:3000"
    depends_on:
      node-api:
        condition: service_healthy
    networks:
      - app-network

  node-api:
    build:
      context: ./node-stats-service
      dockerfile: Dockerfile
    environment:
      PORT: "4000"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
    ports:
      - "4000:4000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
